<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" fill="none">
  <defs>
    <!-- Background studio atmosphere -->
    <radialGradient id="bg-work-021" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#312620" />
      <stop offset="100%" stop-color="#1e1916" />
    </radialGradient>
    
    <!-- Nail bed 3D gradient -->
    <linearGradient id="nail-base-work-021" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faeee3" />
      <stop offset="30%" stop-color="#edd5c3" />
      <stop offset="70%" stop-color="#ddba9e" />
      <stop offset="100%" stop-color="#caa080" />
    </linearGradient>

    <!-- Gloss highlight arc -->
    <linearGradient id="gloss-work-021" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Accent metallic gradient -->
    <linearGradient id="accent-grad-work-021" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6ded6" />
      <stop offset="45%" stop-color="#fff5eb" />
      <stop offset="70%" stop-color="#e6ded6" />
      <stop offset="100%" stop-color="#1e1916" />
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="shadow-work-021" x="-20%" y="-10%" width="140%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Canvas background -->
  <rect width="800" height="800" fill="url(#bg-work-021)" />

  <!-- Subtle fine studio grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="800" />
    <line x1="760" y1="0" x2="760" y2="800" />
    <line x1="0" y1="40" x2="800" y2="40" />
    <line x1="0" y1="760" x2="800" y2="760" />
  </g>

  <!-- Central Manicured Nail Silhouette -->
  <g transform="translate(400, 380)">
    <!-- Main Center Nail -->
    <g filter="url(#shadow-work-021)">
      <!-- Nail Shape Path (Almond / Oval / Squoval / Coffin) -->
      <path d="M -70 140 C -75 50 -75 -40 0 -160 C 75 -40 75 50 70 140 C 65 190 -65 190 -70 140 Z" fill="url(#nail-base-work-021)" />

      <!-- Design Layer Accents based on accentType -->
      <ellipse cx="0" cy="0" rx="45" ry="80" fill="url(#accent-grad-work-021)" opacity="0.3" />

      <!-- Specular Gloss Highlight -->
      <path d="M -55 130 C -60 40 -50 -40 -10 -140 C -5 -145 5 -145 0 -135 C -35 -40 -45 40 -40 130 Z" fill="url(#gloss-work-021)" />
    </g>

    <!-- Side companion silhouettes (hands in composition) -->
    <g opacity="0.35" transform="translate(-115, 30) scale(0.75)" filter="url(#shadow-work-021)">
      <path d="M -60 140 C -65 50 -65 -40 0 -150 C 65 -40 65 50 60 140 Z" fill="url(#nail-base-work-021)" />
    </g>
    <g opacity="0.35" transform="translate(115, 30) scale(0.75)" filter="url(#shadow-work-021)">
      <path d="M -60 140 C -65 50 -65 -40 0 -150 C 65 -40 65 50 60 140 Z" fill="url(#nail-base-work-021)" />
    </g>
  </g>

  <!-- Editorial Typography & Metadata Stamp -->
  <g transform="translate(48, 752)">
    <text font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" fill="#e6ded6" text-transform="uppercase">KA NAILS · GEL & CARE</text>
    <text y="-24" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="500" letter-spacing="-0.5" fill="#fdf8f2">Milky Cloud Ombré Fade</text>
  </g>

  <!-- Index number in corner -->
  <g transform="translate(752, 56)" text-anchor="end">
    <text font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" fill="#a0958c">021 / 36</text>
  </g>
</svg>