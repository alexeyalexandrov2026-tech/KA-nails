<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" fill="none">
  <defs>
    <!-- Background studio atmosphere -->
    <radialGradient id="bg-work-030" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2c211a" />
      <stop offset="100%" stop-color="#1b1613" />
    </radialGradient>
    
    <!-- Nail bed 3D gradient -->
    <linearGradient id="nail-base-work-030" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faeee3" />
      <stop offset="30%" stop-color="#edd5c3" />
      <stop offset="70%" stop-color="#ddba9e" />
      <stop offset="100%" stop-color="#caa080" />
    </linearGradient>

    <!-- Gloss highlight arc -->
    <linearGradient id="gloss-work-030" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Accent metallic gradient -->
    <linearGradient id="accent-grad-work-030" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cca43b" />
      <stop offset="45%" stop-color="#fff5eb" />
      <stop offset="70%" stop-color="#cca43b" />
      <stop offset="100%" stop-color="#1b1613" />
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="shadow-work-030" x="-20%" y="-10%" width="140%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Canvas background -->
  <rect width="1000" height="750" fill="url(#bg-work-030)" />

  <!-- Subtle fine studio grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="750" />
    <line x1="960" y1="0" x2="960" y2="750" />
    <line x1="0" y1="40" x2="1000" y2="40" />
    <line x1="0" y1="710" x2="1000" y2="710" />
  </g>

  <!-- Central Manicured Nail Silhouette -->
  <g transform="translate(500, 355)">
    <!-- Main Center Nail -->
    <g filter="url(#shadow-work-030)">
      <!-- Nail Shape Path (Almond / Oval / Squoval / Coffin) -->
      <path d="M -75 140 C -75 40 -75 -60 -70 -130 C -68 -150 -50 -150 0 -150 C 50 -150 68 -150 70 -130 C 75 -60 75 40 75 140 C 65 190 -65 190 -75 140 Z" fill="url(#nail-base-work-030)" />

      <!-- Design Layer Accents based on accentType -->
      <path d="M -68 -110 C -40 -70 40 -70 68 -110 C 72 -135 40 -160 0 -160 C -40 -160 -72 -135 -68 -110 Z" fill="url(#accent-grad-work-030)" />

      <!-- Specular Gloss Highlight -->
      <path d="M -55 130 C -60 40 -50 -40 -10 -140 C -5 -145 5 -145 0 -135 C -35 -40 -45 40 -40 130 Z" fill="url(#gloss-work-030)" />
    </g>

    <!-- Side companion silhouettes (hands in composition) -->
    <g opacity="0.35" transform="translate(-115, 30) scale(0.75)" filter="url(#shadow-work-030)">
      <path d="M -60 140 C -65 50 -65 -40 0 -150 C 65 -40 65 50 60 140 Z" fill="url(#nail-base-work-030)" />
    </g>
    <g opacity="0.35" transform="translate(115, 30) scale(0.75)" filter="url(#shadow-work-030)">
      <path d="M -60 140 C -65 50 -65 -40 0 -150 C 65 -40 65 50 60 140 Z" fill="url(#nail-base-work-030)" />
    </g>
  </g>

  <!-- Editorial Typography & Metadata Stamp -->
  <g transform="translate(48, 702)">
    <text font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" fill="#cca43b" text-transform="uppercase">KA NAILS · FRENCH</text>
    <text y="-24" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="500" letter-spacing="-0.5" fill="#fdf8f2">Diagonal Split Chrome French</text>
  </g>

  <!-- Index number in corner -->
  <g transform="translate(952, 56)" text-anchor="end">
    <text font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" fill="#a0958c">030 / 36</text>
  </g>
</svg>