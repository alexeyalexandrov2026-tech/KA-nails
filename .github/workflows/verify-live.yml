name: verify-live

# Run by hand after a manual upload to Cloudflare Pages (Actions > verify-live >
# Run workflow). It checks the live site against the commit it is run on.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The live checks expect the robots setting the site was deployed with.
      NEXT_PUBLIC_SITE_INDEXING: ${{ vars.SITE_INDEXING }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Playwright's local preview server serves out/ even for live-site tests.
      - name: Build static export
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify the deployed site
        run: npx playwright test tests/deployed-cloudflare.spec.ts
