name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The live-site checks run in verify-live, after this commit is deployed.
      - name: Run E2E tests
        run: npx playwright test --grep-invert "Cloudflare Deployed Production QA"

      # The tested export, ready for a manual upload in Cloudflare Pages
      # (ka-nails > Create deployment) when no API token is configured.
      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: ka-nails-out-${{ github.sha }}
          path: out/
          retention-days: 14
          if-no-files-found: error

      # Second pass with the AI receptionist built in. Its API and Cloudflare
      # Turnstile (Cloudflare's always-pass test key) are faked in the tests
      # (tests/chat.spec.ts); this export is never published.
      - name: Build static export with the chat widget
        env:
          NEXT_PUBLIC_CHAT_API_URL: http://127.0.0.1:4173
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: npm run build

      - name: Run E2E tests with the chat widget
        env:
          NEXT_PUBLIC_CHAT_API_URL: http://127.0.0.1:4173
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: npx playwright test --grep-invert "Cloudflare Deployed Production QA"

  # The Android client in android/. Its offline catalog is generated from the
  # site's sources before every build, so site changes are checked here too.
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # The catalog generator only needs node_modules/typescript.
      - name: Install dependencies
        working-directory: .
        run: npm ci --ignore-scripts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # compileSdk 37; the runner image may not ship this platform yet.
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0"

      # Also validates the checksum of gradle/wrapper/gradle-wrapper.jar.
      - uses: gradle/actions/setup-gradle@v4

      # bundleRelease builds the unsigned App Bundle (AAB) that Play needs.
      - name: Unit tests, lint and builds
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :app:bundleRelease

      # The debug APK installs on any phone with USB debugging (adb install).
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ka-nails-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload unsigned App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: ka-nails-android-unsigned-${{ github.sha }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
          if-no-files-found: error

      - name: Upload test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ka-nails-android-reports-${{ github.sha }}
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    outputs:
      deployed: ${{ steps.deploy.outcome == 'success' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Account IDs are not secret; this is the account that owns ka-nails.
      CLOUDFLARE_ACCOUNT_ID: 41ae0fe583ca26aa3037b70370838147
    steps:
      # Without the token the site is published by hand: download the
      # ka-nails-out-<sha> artifact from this run and upload it in Cloudflare.
      - name: Check Cloudflare credentials
        id: credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Automatic deployment skipped: no CLOUDFLARE_API_TOKEN secret. Upload the ka-nails-out artifact of this run in Cloudflare Pages instead."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check chat readiness before publishing
        if: steps.credentials.outputs.available == 'true' && vars.CHAT_API_URL != ''
        env:
          CHAT_API_URL: ${{ vars.CHAT_API_URL }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: |
          test -n "$TURNSTILE_SITE_KEY"
          curl --fail --silent --show-error --retry 4 --retry-delay 3 "$CHAT_API_URL/api/health" |
            jq -e '.status == "ok" and .provider == "workers-ai" and .modelReady == true and .databaseReady == true and .humanCheck == "on"'

      - uses: actions/checkout@v4
        if: steps.credentials.outputs.available == 'true'

      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.available == 'true'
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        if: steps.credentials.outputs.available == 'true'
        run: npm ci

      # Repository variables (Settings > Secrets and variables > Actions >
      # Variables): SITE_INDEXING=index opens the site to search engines;
      # SITE_URL sets the public origin once the studio has its own domain;
      # CHAT_API_URL is the Worker origin. TURNSTILE_SITE_KEY enables the human check.
      - name: Build static export
        if: steps.credentials.outputs.available == 'true'
        env:
          NEXT_PUBLIC_SITE_INDEXING: ${{ vars.SITE_INDEXING }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_PUBLIC_CHAT_API_URL: ${{ vars.CHAT_API_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.credentials.outputs.available == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=ka-nails --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  # A manual upload is checked with the verify-live workflow instead.
  verify-live:
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The live checks expect the settings the site was deployed with.
      NEXT_PUBLIC_SITE_INDEXING: ${{ vars.SITE_INDEXING }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
      NEXT_PUBLIC_CHAT_API_URL: ${{ vars.CHAT_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Playwright's local preview server serves out/ even for live-site tests.
      - name: Build static export
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify the deployed site
        run: npx playwright test tests/deployed-cloudflare.spec.ts
