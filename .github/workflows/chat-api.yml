name: chat-api

on:
  push:
    paths:
      - "chat-api/**"
      - "content/studio-facts.json"
      - "lib/studio-facts.ts"
      - "supabase/migrations/**"
      - ".github/workflows/chat-api.yml"
  pull_request:
    paths:
      - "chat-api/**"
      - "content/studio-facts.json"
      - "lib/studio-facts.ts"
      - "supabase/migrations/**"
      - ".github/workflows/chat-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chat-api-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: chat-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: chat-api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: chat-api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
    steps:
      - name: Check deployment credentials
        id: credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Worker deployment skipped because CLOUDFLARE_WORKERS_API_TOKEN is unset."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.credentials.outputs.available == 'true'
      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.available == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: chat-api/package-lock.json
      - run: npm ci
        if: steps.credentials.outputs.available == 'true'
      - run: npm exec -- wrangler deploy
        if: steps.credentials.outputs.available == 'true'
      - name: Verify deployed dependencies
        if: steps.credentials.outputs.available == 'true'
        env:
          CHAT_API_URL: ${{ vars.CHAT_API_URL || 'https://ka-nails-chat.alexey-alexandrov2026.workers.dev' }}
        run: |
          curl --fail --silent --show-error --retry 4 --retry-delay 3 "$CHAT_API_URL/api/health" |
            jq -e '.status == "ok" and .provider == "workers-ai" and .modelReady == true and .databaseReady == true and .humanCheck == "on"'
