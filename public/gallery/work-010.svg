<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" fill="none">
  <defs>
    <!-- Background studio atmosphere -->
    <radialGradient id="bg-work-010" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2e2722" />
      <stop offset="100%" stop-color="#1b1715" />
    </radialGradient>
    
    <!-- Nail bed 3D gradient -->
    <linearGradient id="nail-base-work-010" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faeee3" />
      <stop offset="30%" stop-color="#edd5c3" />
      <stop offset="70%" stop-color="#ddba9e" />
      <stop offset="100%" stop-color="#caa080" />
    </linearGradient>

    <!-- Gloss highlight arc -->
    <linearGradient id="gloss-work-010" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Accent metallic gradient -->
    <linearGradient id="accent-grad-work-010" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a918a" />
      <stop offset="45%" stop-color="#fff5eb" />
      <stop offset="70%" stop-color="#9a918a" />
      <stop offset="100%" stop-color="#1b1715" />
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="shadow-work-010" x="-20%" y="-10%" width="140%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Canvas background -->
  <rect width="1000" height="750" fill="url(#bg-work-010)" />

  <!-- Subtle fine studio grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="750" />
    <line x1="960" y1="0" x2="960" y2="750" />
    <line x1="0" y1="40" x2="1000" y2="40" />
    <line x1="0" y1="710" x2="1000" y2="710" />
  </g>

  <!-- Central Manicured Nail Silhouette -->
  <g transform="translate(500, 355)">
    <!-- Main Center Nail -->
    <g filter="url(#shadow-work-010)">
      <!-- Nail Shape Path (Almond / Oval / Squoval / Coffin) -->
      <path d="M -70 140 C -75 50 -75 -40 0 -160 C 75 -40 75 50 70 140 C 65 190 -65 190 -70 140 Z" fill="url(#nail-base-work-010)" />

      <!-- Design Layer Accents based on accentType -->
      <path d="M -50 -130 Q 0 -60 20 20 T -10 120" stroke="#fcfbf9" stroke-width="4" stroke-linecap="round" opacity="0.6" />
                 <path d="M 30 -140 Q -10 -20 10 60" stroke="#9a918a" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />

      <!-- Specular Gloss Highlight -->
      <path d="M -55 130 C -60 40 -50 -40 -10 -140 C -5 -145 5 -145 0 -135 C -35 -40 -45 40 -40 130 Z" fill="url(#gloss-work-010)" />
    </g>

    <!-- Side companion silhouettes (hands in composition) -->
    <g opacity="0.35" transform="translate(-115, 30) scale(0.75)" filter="url(#shadow-work-010)">
      <path d="M -60 140 C -65 50 -65 -40 0 -150 C 65 -40 65 50 60 140 Z" fill="url(#nail-base-work-010)" />
    </g>
    <g opacity="0.35" transform="translate(115, 30) scale(0.75)" filter="url(#shadow-work-010)">
      <path d="M -60 140 C -65 50 -65 -40 0 -150 C 65 -40 65 50 60 140 Z" fill="url(#nail-base-work-010)" />
    </g>
  </g>

  <!-- Editorial Typography & Metadata Stamp -->
  <g transform="translate(48, 702)">
    <text font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" fill="#9a918a" text-transform="uppercase">KA NAILS · NAIL ART</text>
    <text y="-24" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="500" letter-spacing="-0.5" fill="#fdf8f2">Italian Carrara White Marble</text>
  </g>

  <!-- Index number in corner -->
  <g transform="translate(952, 56)" text-anchor="end">
    <text font-family="'Inter', -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" fill="#a0958c">010 / 36</text>
  </g>
</svg>